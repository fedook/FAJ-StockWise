<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 140" fill="none" role="img" aria-labelledby="logo-title logo-desc">
  <title id="logo-title">FAJ Stockwise</title>
  <desc id="logo-desc">FAJ Stockwise sales and inventory logo</desc>
  <defs>
    <linearGradient id="faj-mark" x1="8" y1="8" x2="132" y2="132" gradientUnits="userSpaceOnUse">
      <stop stop-color="#14385a" />
      <stop offset="1" stop-color="#081a2c" />
    </linearGradient>
  </defs>

  <!-- Navy mark with a white F, gold accent bar and blue rising bars -->
  <rect x="8" y="8" width="124" height="124" rx="32" fill="url(#faj-mark)" />
  <rect x="9" y="9" width="122" height="122" rx="31" stroke="#3a80b8" stroke-opacity="0.38" stroke-width="2" />

  <rect x="48" y="31" width="17" height="78" rx="8" fill="#ffffff" />
  <rect x="48" y="31" width="50" height="17" rx="8" fill="#ffffff" />
  <rect x="48" y="61" width="40" height="16" rx="8" fill="#e5a44c" />

  <rect x="101" y="84" width="11" height="28" rx="5.5" fill="#3a80b8" />
  <rect x="116" y="70" width="11" height="42" rx="5.5" fill="#5f9dce" />

  <!-- Wordmark -->
  <text x="152" y="76" fill="#0a1f34" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-1.2">FAJ</text>
  <text x="246" y="76" fill="#2b669c" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="44" font-weight="600" letter-spacing="-1.2">Stockwise</text>
  <rect x="154" y="92" width="74" height="5" rx="2.5" fill="#e5a44c" />
</svg>
